<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="./readDoctor.css">
        <title>Read All Doctors</title>
    </head>
    <body>
        <header>
            <h1>Read Doctor</h1>
        </header>
        <main>
            <button type="button" id="read-all-doctors">Get all doctor details</button>
            <section class="message">
                <p class="error-message"></p>
            </section>
            <template class="doctor-template">
                <section class="doctor-data">
                    <table>
                        <tbody class="doctor-table-body">
                            <tr>
                                <th>Id</th>
                                <td class="doctor-id">1</td>
                            </tr>
                            <tr>
                                <th>Name</th>
                                <td class="doctor-name">Balasanthosh</td>
                            </tr>
                            <tr>
                                <th>Email</th>
                                <td class="doctor-email">balasanthosh@fmail.com</td>
                            </tr>
                            <tr>
                                <th>Age</th>
                                <td class="doctor-age">20</td>
                            </tr>
                            <tr>
                                <th>Phone Number</th>
                                <td class="doctor-phone-number">7878787878</td>
                            </tr>
                        </tbody>
                    </table>
                </section>
            </template>
            <section class="show-doctor-data"></section>
        </main>
        <footer>
            <p><span>&copy;</span> Designed and developed by Balasanthosh</p>
        </footer>

        <script src="./readDoctor.js"></script>
    </body>
</html>
